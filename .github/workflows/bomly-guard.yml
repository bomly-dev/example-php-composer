name: Bomly Guard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - name: Guard dependency changes
        uses: bomly-dev/bomly-guard@v1
        with:
          cli-token: ${{ github.token }}
          log-level: debug
          ecosystems: php
          fail-on: high
          comment-summary-in-pr: always
